{% extends "base.html" %}
{% block title %}Team{% endblock %}
{% block content %}
<article>
    <header class="article-header">
        <strong>Team</strong>
    </header>
    <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th>Naam</th>
                    <th>E-mail</th>
                    <th>Rol</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.first_name }} {{ user.last_name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ "Team" if user.is_team else "—" }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</article>
{% endblock %}
