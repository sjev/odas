<!DOCTYPE html>
<html lang="nl" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - {{ org.app_title }}</title>
    {% if org.favicon %}<link rel="icon" type="image/png" href="{{ org.favicon }}">{% endif %}
    <link rel="stylesheet" href="/static/pico.min.css?v={{ version }}">
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
    <script src="/static/theme.js?v={{ version }}"></script>
    {% if analytics %}<script defer src="{{ analytics.src }}"
        data-website-id="{{ analytics.website_id }}"></script>{% endif %}
</head>

<body>
    <main class="container" style="max-width: 400px; margin-top: 15vh;">
        <article>
            <header>
                <h2>{{ org.app_title }}</h2>
            </header>
            {% if error %}
            <p style="color: var(--pico-del-color);">Inloggen mislukt ({{ error }}).
                <a href="/login">Opnieuw proberen</a>
            </p>
            {% else %}
            <p>Doorsturen...</p>
            {% endif %}
        </article>
    </main>
</body>

</html>
