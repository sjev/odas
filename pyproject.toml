[project]
name = "odas"
dynamic = ["version"]
description = "Configurable case management for NGOs, jurists and civil-society organisations"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Jev Kuznetsov", email = "jev@kuznetsov.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "python-multipart",
    "uvicorn",
    "jinja2>=3.1.6",
    "joserfc",
    "pydantic>=2",
    "pyyaml>=6",
    "setuptools-scm",
    "markupsafe>=3.0.3",
    "markdown>=3.10.2",
    "nh3>=0.2",
    "typer>=0.12",
    "rich>=13",
    "httpx2>=2.4.0",
    "aiosmtpd>=1.4",
    "dkimpy>=1.1",
    "cryptography>=42",
    "pypdf>=4.0",
    "openai>=2.54.0",
    "pyzipper>=0.4.0",
    "tzdata>=2026.4",
]

[project.scripts]
odas = "odas.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115",
    "invoke>=2.2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "types-pyyaml>=6.0.12.20260518",
    "types-markdown>=3.7",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "tests"]

# dkimpy and pyzipper ship no type information.
[[tool.mypy.overrides]]
module = ["dkim", "pyzipper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
core = "sysmon"

[tool.coverage.report]
# A ratchet, not a target: raise it when the suite earns it, never lower it to
# make a build pass.
fail_under = 84

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "C4", "TID", "SIM", "PLE", "RUF"]
ignore = [
    "D100", "D101", "D102", "D103",  # Missing docstrings
    "N806", "N803",  # Invalid name patterns
    "G201",  # Logging f-string interpolation
    "ARG001",  # Unused function argument
    "BLE001",  # Blind except
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]  # FastAPI dependency-injection idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]  # Allow unused arguments in tests

[tool.ruff.lint.isort]
known-first-party = ["odas"]
